<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; media-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self'">
  <title>JU Toolbox</title>
  <meta name="description" content="Werkzeuge für JuicyUnderground: Video-Ton zu Mono, Video hinter PNG legen. Alles lokal im Browser.">
  <link rel="icon" href="assets/ju-logo-blue.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <span class="stripe stripe-pink" aria-hidden="true"></span>
      <span class="stripe stripe-black" aria-hidden="true"></span>
      <svg class="logo" viewBox="0 0 1500 1047.01" role="img" aria-label="JuicyUnderground">
        <path fill="currentColor" d="M1500,20.31v568.73c0,251.24-202.4,457.45-453.62,457.97-79.32.15-153.89-19.99-218.85-55.51-27.7-15.17-53.63-33.1-77.45-53.47-.02-.03-.37-.27-.37-.27,0,0-11.6-7.31-98.18-89.09-86.58-81.77,52.91,108.23,52.91,108.23l5.3,7.38c.98,1.37.86,3.22-.2,4.44-.2.22-.42.42-.68.59-72.83,49.2-160.65,77.88-255.22,77.69C202.4,1046.49,0,840.28,0,589.04v-149.73c0-12.22,10.72-21.67,22.84-20.16l277.72,34.81c10.17,1.27,17.79,9.92,17.79,20.16v118.31c0,75.22,61.02,136.24,136.24,136.24s136.24-61.02,136.24-136.24V129.17c0-10.24,7.62-18.88,17.79-20.16l13.75-1.73,263.97-33.06c12.12-1.52,22.84,7.94,22.84,20.15v498.06c0,75.22,61,136.24,136.24,136.24s136.24-61.02,136.24-136.24V55.12c0-10.24,7.62-18.88,17.79-20.16L1477.16.16c12.12-1.52,22.84,7.92,22.84,20.15Z"/>
      </svg>
      <p class="kicker">JuicyUnderground</p>
      <h1 id="t-title"></h1>
      <p id="t-sub" class="hero-sub"></p>
      <p id="t-privacy" class="chip chip-lime"></p>
    </header>

    <nav class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" id="tab-mono" aria-controls="panel-mono" data-tool="mono"></button>
      <button type="button" role="tab" id="tab-overlay" aria-controls="panel-overlay" data-tool="overlay"></button>
    </nav>

    <main>
      <!-- 01.Mono -->
      <section class="card tool" id="panel-mono" role="tabpanel" aria-labelledby="tab-mono" tabindex="0">
        <h2 id="m-title"></h2>
        <p id="m-sub" class="tool-sub"></p>

        <label class="dropzone" id="mono-drop" for="mono-file">
          <input id="mono-file" type="file" accept=".mp4,.mov,.m4v,.mkv,.webm,video/*">
          <span class="dz-icon" aria-hidden="true">+</span>
          <span class="dz-text" id="m-drop"></span>
          <span class="dz-hint" id="m-hint"></span>
        </label>
        <p id="mono-info" class="fileinfo" hidden></p>

        <button id="mono-go" type="button" class="btn" disabled></button>

        <div class="output">
          <div id="mono-progress-wrap" class="progress" hidden>
            <progress id="mono-progress" max="100"></progress>
            <span id="mono-progress-label"></span>
          </div>
          <button type="button" id="mono-cancel" class="btn btn-ghost btn-cancel" hidden></button>
          <div id="mono-status" class="status" role="status" aria-live="polite"></div>
          <a id="mono-download" class="btn btn-download" hidden></a>
          <details id="mono-details" hidden>
            <summary class="t-details"></summary>
            <pre id="mono-log"></pre>
          </details>
        </div>
      </section>

      <!-- 02.Overlay -->
      <section class="card tool" id="panel-overlay" role="tabpanel" aria-labelledby="tab-overlay" tabindex="0" hidden>
        <h2 id="o-title"></h2>
        <p id="o-sub" class="tool-sub"></p>

        <div class="drop-grid">
          <label class="dropzone dropzone-sm" id="ov-video-drop" for="ov-video-file">
            <input id="ov-video-file" type="file" accept=".mp4,.mov,.m4v,.mkv,.webm,video/*">
            <span class="dz-icon" aria-hidden="true">+</span>
            <span class="dz-text" id="o-video-drop"></span>
            <span class="dz-hint" id="ov-video-name"></span>
          </label>
          <label class="dropzone dropzone-sm" id="ov-png-drop" for="ov-png-file">
            <input id="ov-png-file" type="file" accept=".png,image/png">
            <span class="dz-icon" aria-hidden="true">+</span>
            <span class="dz-text" id="o-png-drop"></span>
            <span class="dz-hint" id="ov-png-name"></span>
          </label>
        </div>

        <div class="options">
          <fieldset class="chips">
            <legend id="o-format"></legend>
            <div class="chip-row" id="ov-formats"></div>
          </fieldset>
          <fieldset class="chips">
            <legend id="o-bg"></legend>
            <div class="chip-row" id="ov-colors"></div>
          </fieldset>
        </div>

        <div id="ov-editor" class="editor" hidden>
          <div class="stage-wrap">
            <div id="ov-stage" class="stage" tabindex="0" role="application">
              <video id="ov-video" muted loop playsinline autoplay></video>
              <img id="ov-png" alt="">
            </div>
          </div>
          <div class="preview-controls">
            <button type="button" id="ov-sound" class="sound" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/>
                <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
                <path class="cross" d="m16 9 6 6m0-6-6 6"/>
              </svg>
              <span id="ov-sound-label"></span>
            </button>
          </div>

          <fieldset class="chips trim">
            <legend id="o-trim"></legend>
            <div class="chip-row" id="ov-trims"></div>
            <div class="timeline" id="ov-timeline" aria-hidden="true">
              <div class="tl-sel" id="ov-tl-sel"></div>
              <div class="tl-head" id="ov-tl-head"></div>
            </div>
            <p class="trim-info" id="ov-trim-info"></p>
            <div class="sliders">
              <label class="slider"><span id="o-start"></span><input id="ov-start" type="range" min="0" step="0.1"><output id="ov-start-out"></output></label>
              <label class="slider" id="ov-end-row"><span id="o-end"></span><input id="ov-end" type="range" min="0" step="0.1"><output id="ov-end-out"></output></label>
            </div>
          </fieldset>

          <fieldset class="chips">
            <legend id="o-layer"></legend>
            <div class="chip-row" id="ov-layers"></div>
          </fieldset>

          <div class="sliders">
            <label class="slider"><span id="o-x"></span><input id="ov-x" type="range" step="1"><output id="ov-x-out"></output></label>
            <label class="slider"><span id="o-y"></span><input id="ov-y" type="range" step="1"><output id="ov-y-out"></output></label>
            <label class="slider"><span id="o-scale"></span><input id="ov-scale" type="range" min="5" max="400" step="1"><output id="ov-scale-out"></output></label>
          </div>

          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="ov-center"></button>
            <button type="button" class="btn btn-ghost" id="ov-cover"></button>
            <button type="button" class="btn btn-ghost" id="ov-contain"></button>
          </div>
        </div>

        <p id="ov-note" class="note"></p>
        <button id="ov-go" type="button" class="btn" disabled></button>

        <div class="output">
          <div id="ov-progress-wrap" class="progress" hidden>
            <progress id="ov-progress" max="100"></progress>
            <span id="ov-progress-label"></span>
          </div>
          <button type="button" id="ov-cancel" class="btn btn-ghost btn-cancel" hidden></button>
          <div id="ov-status" class="status" role="status" aria-live="polite"></div>
          <a id="ov-download" class="btn btn-download" hidden></a>
          <details id="ov-details" hidden>
            <summary class="t-details"></summary>
            <pre id="ov-log"></pre>
          </details>
        </div>
      </section>
    </main>

    <footer>
      <p id="version" class="version"></p>
      <p id="t-footer"></p>
    </footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
